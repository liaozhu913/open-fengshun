body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #f5f5f5; color: #333; }
.header { background: #1a5276; color: white; padding: 1.5rem 1rem; text-align: center; }
.header h1 { font-size: 1.5rem; }
.header p { opacity: 0.7; font-size: 0.85rem; margin-top: 0.3rem; }
.tabs { display: flex; overflow-x: auto; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
.tab { flex-shrink: 0; padding: 0.8rem 1.2rem; font-size: 0.9rem; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { border-bottom-color: #1a5276; color: #1a5276; font-weight: 600; }
.tab:hover { background: #f8f9fa; }
.container { max-width: 700px; margin: 0 auto; padding: 0.5rem; }
.section { display: none; }
.section.active { display: block; }
.card { background: white; border-radius: 10px; padding: 1rem; margin: 0.5rem 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.card h3 { font-size: 1rem; margin-bottom: 0.4rem; color: #1a5276; }
.card .row { display: flex; align-items: center; gap: 0.5rem; margin: 0.25rem 0; font-size: 0.88rem; color: #555; }
.card .label { color: #999; min-width: 2.5em; }
.card .phone-link { color: #27ae60; text-decoration: none; font-weight: 600; }
.card .phone-link:hover { text-decoration: underline; }
.badge { display: inline-block; background: #e8f4fd; color: #1a5276; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; margin-left: 0.3rem; }
.footer { text-align: center; padding: 2rem 1rem; color: #bbb; font-size: 0.8rem; }
.town-filter { padding: 0.5rem 1rem; background: white; }
.town-filter select { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; }
</style>

var currentSection = 'government';
function show(section) {
  currentSection = section;
  document.querySelectorAll('.tab').forEach(function(t,i){
    var sections = ['government','medical','police','education','finance','logistics','transport'];
    t.classList.toggle('active', sections[i]===section);
  });
  render();
}
function filterTown() { render(); }
function render() {
  var town = document.getElementById('townSelect').value;
  var items = data[currentSection] || [];
  if(town) items = items.filter(function(i){return i.town===town});
  var html = '';
  items.forEach(function(item){
    html += '<div class="card">';
    html += '<h3>'+item.name+'<span class="badge">'+item.town+'</span></h3>';
    if(item.address) html += '<div class="row"><span class="label">📍</span>'+item.address+'</div>';
    if(item.phone) html += '<div class="row"><span class="label">📞</span><a href="tel:'+item.phone+'" class="phone-link">'+item.phone+'</a></div>';
    if(item.services) html += '<div class="row"><span class="label">🔧</span>'+item.services+'</div>';
    if(item.hours) html += '<div class="row"><span class="label">🕐</span>'+item.hours+'</div>';
    html += '</div>';
  });
  if(!items.length) html = '<div style="text-align:center;padding:3rem;color:#999;">该镇暂无数据，<a href="koubei.html" style="color:#1a5276;">去推荐一个</a></div>';
  document.getElementById('content').innerHTML = html;
}
render();
